<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#192d4e">
  <meta name="description" content="把每天的努力记下来。按行测与申论模块记录学习内容、用时和刷题情况。">
  <title>上岸日记 · 每日学习打卡</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23192d4e'/%3E%3Cpath d='M17 18h20a9 9 0 0 1 9 9v23H26a9 9 0 0 1-9-9z' fill='%23eaf0fd'/%3E%3Cpath d='M25 28h13M25 35h13' stroke='%23192d4e' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="design.css">
  <script defer src="app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#today"><span class="brand-mark" data-icon="book"></span><span>上岸日记<small>我的备考记录本</small></span></a>
    <div class="nav-caption">学习手账</div>
    <nav aria-label="主导航">
      <a href="#today" data-page="today"><span data-icon="sun"></span>每日打卡<span class="nav-dot"></span></a>
      <a href="#history" data-page="history"><span data-icon="calendar"></span>学习记录</a>
      <a href="#stats" data-page="stats"><span data-icon="chart"></span>学习统计</a>
      <a href="#route" data-page="route"><span data-icon="route"></span>学习路线</a>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-note"><span data-icon="book"></span><p>学了什么，记下来。<br>回头看，才知道走了多远。</p></div>
      <button class="backup-button" data-action="backup"><span data-icon="download"></span>数据与备份<span data-icon="chevronRight"></span></button>
      <div class="local-note"><span class="status-dot"></span>记录保存在当前浏览器</div>
    </div>
  </aside>
  <main id="main" tabindex="-1">
    <header class="topbar"><div class="breadcrumb">我的备考空间 <span>/</span> <strong id="pageName">每日打卡</strong></div><div class="topbar-right"><span id="todayLabel"></span><span class="avatar" aria-label="我的空间">学</span></div></header>
    <div id="storageWarning" class="warning" hidden></div>
    <div id="app"></div>
    <footer>记录保存在当前浏览器，可在「数据与备份」中导出。<span>上岸日记</span></footer>
  </main>
  <dialog id="entryDialog" class="entry-dialog" aria-labelledby="entryTitle">
    <form id="entryForm">
      <div class="dialog-head"><div><h2 id="entryTitle">记录学习</h2><p class="muted small">选好模块，记下这次学了什么。</p></div><button type="button" class="icon-button" data-action="close-entry" aria-label="关闭"><span data-icon="x"></span></button></div>
      <input type="hidden" name="id">
      <div class="form-grid"><label>学习日期<input type="date" name="date" required></label><label>学习方式<select name="kind"><option>听课学习</option><option>专项刷题</option><option>错题复盘</option><option>套卷模考</option><option>阅读积累</option><option>写作练习</option></select></label></div>
      <label>学习模块 <span class="required">*</span></label><div id="modulePicker" class="module-picker" role="group" aria-label="选择学习模块"></div><input type="hidden" name="module" value="verbal">
      <label class="field-label">具体题型<select name="submodule"></select></label>
      <label class="field-label">今天学了什么 <span class="required">*</span><textarea name="content" rows="3" maxlength="2000" placeholder="例如：学完中心理解题的转折关系，整理了 3 道错题……" required></textarea></label>
      <div class="form-grid triple"><label>学习时长（分钟）<input name="minutes" type="number" min="1" max="1440" step="1" inputmode="numeric" placeholder="如 60" required></label><label>刷题数（选填）<input name="questions" type="number" min="0" max="10000" step="1" inputmode="numeric" placeholder="如 20"></label><label>答对数（选填）<input name="correct" type="number" min="0" max="10000" step="1" inputmode="numeric" placeholder="如 16"></label></div>
      <label class="field-label">收获 / 待解决的问题（选填）<textarea name="note" rows="2" maxlength="2000" placeholder="留下一个收获，或明天要继续解决的问题。"></textarea></label>
      <div id="formError" class="form-error" role="alert"></div>
      <div class="dialog-footer"><span>带 * 的内容需要填写</span><button class="button primary" type="submit"><span data-icon="check"></span>保存打卡</button></div>
    </form>
  </dialog>
  <dialog id="settingsDialog" class="small-dialog"><div class="dialog-head"><div><h2>每日学习目标</h2></div><button class="icon-button" data-action="close-settings" aria-label="关闭"><span data-icon="x"></span></button></div><p class="muted">按你每天可用的时间设置，之后可以随时调整。</p><form id="goalForm"><label>每天计划学习（分钟）<input id="goalInput" type="number" min="1" max="1440" step="1" required></label><button type="submit" class="button primary full">保存目标</button></form></dialog>
  <dialog id="backupDialog" class="small-dialog"><div class="dialog-head"><div><h2>数据与备份</h2></div><button class="icon-button" data-action="close-backup" aria-label="关闭"><span data-icon="x"></span></button></div><p class="muted">学习记录保存在当前浏览器中。换设备或清理浏览器前，先导出一份备份，之后可导入继续记录。</p><div class="backup-info" id="backupInfo"></div><button class="button primary full" data-action="export"><span data-icon="download"></span>导出全部学习记录</button><button class="button secondary full" data-action="import"><span data-icon="upload"></span>导入备份文件</button><p class="small muted">导入会合并记录；相同记录保留更新的版本。</p><input type="file" id="importFile" accept=".json,application/json" hidden></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
